name: Card quality audit
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/quality-audit.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable T card DB release tag to audit"
        required: true
        type: string
        default: fm1-carddb-27
permissions:
  contents: read
  actions: write
jobs:
  quality-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run audit and cost decoder self-tests
        run: |
          set -euo pipefail
          python scripts/quality_audit.py --self-test
          python scripts/infer_playable_costs.py --self-test
          python scripts/decode_soul_costs.py --self-test
          python scripts/build_db.py --self-test
      - name: Download immutable source card records
        env:
          TAG: ${{ inputs.release_tag || 'fm1-carddb-27' }}
        run: |
          set -euo pipefail
          mkdir -p audit-input audit-output
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl --fail --location --retry 3 "${BASE}/cards.jsonl.gz" -o audit-input/cards.jsonl.gz
          gzip -dc audit-input/cards.jsonl.gz > audit-input/cards.jsonl
          curl --fail --location --retry 3 "${BASE}/enumtable.json" -o audit-input/enumtable.json
          test -s audit-input/cards.jsonl
          test -s audit-input/enumtable.json
      - name: Download and audit immutable card image archive
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/fm1-carddb-27"
          mkdir -p audit-input audit-output/image-audit
          curl --fail --location --retry 3 --retry-all-errors "${BASE}/images.tar.gz.part-aa" -o audit-input/images.tar.gz.part-aa
          gzip -t audit-input/images.tar.gz.part-aa
          python scripts/audit_image_archive.py \
            --archive audit-input/images.tar.gz.part-aa \
            --cards-jsonl audit-input/cards.jsonl \
            --output-dir audit-output/image-audit
      - name: Audit card fields, taxonomy and detail URLs
        run: |
          set -euo pipefail
          python scripts/audit_card_taxonomy.py \
            --cards-jsonl audit-input/cards.jsonl \
            --enumtable audit-input/enumtable.json \
            --expected 15350 \
            --output audit-output/card-taxonomy-audit.json
      - name: Run source record quality audit
        run: |
          set -euo pipefail
          python scripts/quality_audit.py \
            --cards-jsonl audit-input/cards.jsonl \
            --expected 15350 \
            --output audit-output/quality-audit.json
      - name: Build normalized SQLite card database
        run: |
          set -euo pipefail
          mkdir -p data/raw audit-output/sqlite
          cp audit-input/cards.jsonl data/raw/cards.jsonl
          cp audit-input/enumtable.json data/raw/enumtable.json
          cp audit-output/image-audit/image-manifest.jsonl data/raw/image-manifest.jsonl
          python scripts/build_db.py
          python - <<'PY'
          import gzip, json, sqlite3
          from pathlib import Path
          db = sqlite3.connect("data/fm1_cards.sqlite")
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          cards = db.execute("SELECT COUNT(*) FROM cards").fetchone()[0]
          costs = db.execute("SELECT COUNT(*) FROM card_costs").fetchone()[0]
          known = db.execute("SELECT COUNT(*) FROM card_costs WHERE soul_known=1").fetchone()[0]
          review = db.execute("SELECT COUNT(*) FROM card_costs WHERE soul_known=0").fetchone()[0]
          semantic_review = db.execute("SELECT COUNT(*) FROM card_costs WHERE semantic_review=1").fetchone()[0]
          tokens = db.execute("SELECT COUNT(*) FROM card_soul_cost_tokens").fetchone()[0]
          search_rows = db.execute("SELECT COUNT(*) FROM card_search").fetchone()[0]
          image_rows = db.execute("SELECT COUNT(*) FROM card_images").fetchone()[0]
          verified_images = db.execute("SELECT COUNT(*) FROM card_images WHERE download_status='archive_verified' AND mime_type='image/webp' AND sha256 IS NOT NULL").fetchone()[0]
          search_test = db.execute("SELECT COUNT(*) FROM card_search WHERE card_search MATCH 'NCS'").fetchone()[0]
          fk = db.execute("PRAGMA foreign_key_check").fetchall()
          summary = {"integrity": integrity, "cards": cards, "costRows": costs,
                     "decodedSoulCosts": known, "unresolvedSoulCosts": review,
                     "specialSemanticsReview": semantic_review, "soulTokens": tokens, "searchIndexRows": search_rows, "imageRows": image_rows, "archiveVerifiedImages": verified_images, "ncsSearchHits": search_test, "foreignKeyErrors": len(fk)}
          Path("audit-output/sqlite/sqlite-build-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          if integrity != "ok" or cards != 15350 or costs != 15350 or known != 15350 or review != 0 or semantic_review != 779 or search_rows != 15350 or image_rows != 30700 or verified_images != 30700 or search_test < 1 or fk:
              raise SystemExit("SQLite card DB validation failed: " + json.dumps(summary))
          with gzip.open("audit-output/sqlite/fm1_cards.sqlite.gz", "wb", compresslevel=6) as out:
              with open("data/fm1_cards.sqlite", "rb") as source:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      out.write(chunk)
          print(json.dumps(summary, ensure_ascii=False))
          PY
      - name: Decode source RequireSoul values
        run: |
          set -euo pipefail
          python scripts/decode_soul_costs.py \
            --cards-jsonl audit-input/cards.jsonl \
            --output-dir audit-output/cost-decoding
      - name: Publish audit, SQLite database and decoded cost outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-db-sqlite-special-soul-decoding-${{ inputs.release_tag || 'fm1-carddb-27' }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
