name: Card quality audit

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/quality-audit.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable T card DB release tag to audit"
        required: true
        type: string
        default: fm1-carddb-27

permissions:
  contents: read

concurrency:
  group: card-quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.release_tag || 'fm1-carddb-27' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run parser and audit tests
        run: |
          set -euo pipefail
          python -m unittest tests/test_effect_pattern_audit.py
          python -m unittest tests/test_cost_decoding.py
          python scripts/quality_audit.py --self-test
          python scripts/decode_soul_costs.py --self-test
          python scripts/build_db.py --self-test
      - name: Download immutable card records and enum dictionary
        run: |
          set -euo pipefail
          mkdir -p audit-input audit-output
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 3 "${BASE}/cards.jsonl.gz" -o audit-input/cards.jsonl.gz
          gzip -dc audit-input/cards.jsonl.gz > audit-input/cards.jsonl
          curl --fail --location --retry 3 "${BASE}/enumtable.json" -o audit-input/enumtable.json
          test -s audit-input/cards.jsonl
          test -s audit-input/enumtable.json
      - name: Download and audit immutable card image archive
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          mkdir -p audit-output/image-audit
          curl --fail --location --retry 3 --retry-all-errors "${BASE}/images.tar.gz.part-aa" -o audit-input/images.tar.gz.part-aa
          gzip -t audit-input/images.tar.gz.part-aa
          python scripts/audit_image_archive.py \
            --archive audit-input/images.tar.gz.part-aa \
            --cards-jsonl audit-input/cards.jsonl \
            --output-dir audit-output/image-audit
      - name: Audit card fields, taxonomy and exact detail URLs
        run: |
          set -euo pipefail
          python scripts/audit_card_taxonomy.py \
            --cards-jsonl audit-input/cards.jsonl \
            --enumtable audit-input/enumtable.json \
            --expected 15350 \
            --output audit-output/card-taxonomy-audit.json
      - name: Audit raw card values without inventing missing data
        run: |
          set -euo pipefail
          python scripts/quality_audit.py \
            --cards-jsonl audit-input/cards.jsonl \
            --expected 15350 \
            --output audit-output/quality-audit.json
      - name: Build normalized SQLite database with explicit review flags
        run: |
          set -euo pipefail
          mkdir -p data/raw audit-output/sqlite audit-output/cost-decoding
          cp audit-input/cards.jsonl data/raw/cards.jsonl
          cp audit-input/enumtable.json data/raw/enumtable.json
          cp audit-output/image-audit/image-manifest.jsonl data/raw/image-manifest.jsonl
          python scripts/build_db.py
          python scripts/decode_soul_costs.py \
            --cards-jsonl audit-input/cards.jsonl \
            --output-dir audit-output/cost-decoding
          python - <<'PY'
          import gzip, json, sqlite3
          from pathlib import Path

          db = sqlite3.connect("data/fm1_cards.sqlite")
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          cards = db.execute("SELECT COUNT(*) FROM cards").fetchone()[0]
          costs = db.execute("SELECT COUNT(*) FROM card_costs").fetchone()[0]
          decoded = db.execute("SELECT COUNT(*) FROM card_costs WHERE soul_known=1").fetchone()[0]
          unresolved = db.execute("SELECT COUNT(*) FROM card_costs WHERE soul_known=0").fetchone()[0]
          mapping_review = db.execute("SELECT COUNT(*) FROM card_costs WHERE mapping_review=1").fetchone()[0]
          semantic_review = db.execute("SELECT COUNT(*) FROM card_costs WHERE semantic_review=1").fetchone()[0]
          tokens = db.execute("SELECT COUNT(*) FROM card_soul_cost_tokens").fetchone()[0]
          search_rows = db.execute("SELECT COUNT(*) FROM card_search").fetchone()[0]
          image_rows = db.execute("SELECT COUNT(*) FROM card_images").fetchone()[0]
          verified_images = db.execute(
              "SELECT COUNT(*) FROM card_images WHERE download_status='archive_verified' "
              "AND mime_type='image/webp' AND sha256 IS NOT NULL AND archive_path IS NOT NULL"
          ).fetchone()[0]
          ncs_hits = db.execute(
              "SELECT COUNT(*) FROM card_search WHERE card_search MATCH 'NCS'"
          ).fetchone()[0]
          korean_hits = db.execute(
              "SELECT COUNT(*) FROM card_search WHERE card_search MATCH '선물쟁탈전'"
          ).fetchone()[0]
          detail_urls = db.execute(
              "SELECT COUNT(*) FROM cards WHERE source_card_url LIKE 'https://fmlunatic.com/card/%'"
          ).fetchone()[0]
          fk_errors = len(db.execute("PRAGMA foreign_key_check").fetchall())

          summary = {
              "releaseTag": "${{ inputs.release_tag || 'fm1-carddb-27' }}",
              "integrity": integrity,
              "cards": cards,
              "costRows": costs,
              "decodedSoulCosts": decoded,
              "unresolvedSoulCosts": unresolved,
              "hybridMappingReview": mapping_review,
              "specialSemanticsReview": semantic_review,
              "soulTokens": tokens,
              "searchIndexRows": search_rows,
              "imageRows": image_rows,
              "archiveVerifiedImages": verified_images,
              "ncsSearchHits": ncs_hits,
              "koreanSearchHits": korean_hits,
              "detailUrlRows": detail_urls,
              "foreignKeyErrors": fk_errors,
          }
          Path("audit-output/sqlite/sqlite-build-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          if (
              integrity != "ok" or cards != 15350 or costs != 15350
              or decoded != 15350 or unresolved != 0
              or mapping_review < 1 or semantic_review != 779
              or search_rows != 15350 or image_rows != 30700
              or verified_images != 30700 or ncs_hits < 1 or korean_hits < 1
              or detail_urls != 15350 or fk_errors
          ):
              raise SystemExit("SQLite card DB validation failed: " + json.dumps(summary, ensure_ascii=False))

          with gzip.open("audit-output/sqlite/fm1_cards.sqlite.gz", "wb", compresslevel=6) as out:
              with open("data/fm1_cards.sqlite", "rb") as source:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      out.write(chunk)

          # The immutable source dump has no independent normalized cost reference.
          # Zero comparisons is reported honestly and does not imply cross-validation.
          decode_summary = json.loads(
              Path("audit-output/cost-decoding/requiresoul-decoding-summary.json").read_text(encoding="utf-8")
          )
          summary["independentCostReferenceRows"] = decode_summary["referenceCostRows"]
          summary["independentlyValidatedCosts"] = decode_summary["validatedKnownCosts"]
          summary["costValidationStatus"] = decode_summary["validationStatus"]
          Path("audit-output/sqlite/sqlite-build-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, ensure_ascii=False))
          PY
      - name: Publish audit reports and SQLite database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-db-quality-${{ inputs.release_tag || 'fm1-carddb-27' }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
