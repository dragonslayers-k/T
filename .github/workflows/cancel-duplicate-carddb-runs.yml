name: Cancel duplicate card DB runs
on:
  push:
    branches: [carddb-rebuild]
permissions:
  actions: write
  contents: read
jobs:
  cancel-older:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest card DB run and cancel older queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t runs < <(gh run list --repo "$GH_REPO" --workflow carddb.yml --branch carddb-rebuild --limit 100 --json databaseId,status,createdAt --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | sort_by(.createdAt) | reverse | .[].databaseId')
          if [ "${#runs[@]}" -gt 1 ]; then
            echo "Keeping newest run: ${runs[0]}"
            for id in "${runs[@]:1}"; do
              echo "Cancelling older run: $id"
              gh run cancel "$id" --repo "$GH_REPO" || true
            done
          fi
