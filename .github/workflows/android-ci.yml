name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Data contract and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: node --test
      - name: Validate supplied card database
        shell: bash
        run: |
          if [ -f cards.json ]; then
            node scripts/validate-cards.mjs cards.json
          else
            echo "No cards.json committed; external data pack validation remains a separate task."
          fi
      - name: Android build (only after Gradle scaffold exists)
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Android Gradle project has not been initialized yet; build step deferred."
          fi
