name: DB29 RequireSoul rail visual audit

on:
  push:
    branches:
      - research/require-soul-visual-audit-831-stage1
    paths:
      - "scripts/audit_require_soul_rail.py"
      - "scripts/audit_require_soul_hybrid_orbs.py"
      - "scripts/audit_require_soul_source_join.py"
      - "scripts/probe_require_soul_source_image.py"
      - ".github/workflows/require-soul-rail-audit.yml"
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Existing GitHub Actions run that produced the 831-card image evidence"
        required: true
        type: string
        default: "42357466809"

permissions:
  actions: read
  contents: read

concurrency:
  group: require-soul-rail-audit
  cancel-in-progress: false

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id || '42357466809' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy

      - name: Download immutable DB29 source cards
        run: |
          set -euo pipefail
          mkdir -p source
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/fm1-carddb-29"
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            "${BASE}/cards.jsonl.gz" -o source/cards.jsonl.gz
          gzip -t source/cards.jsonl.gz
          gzip -dc source/cards.jsonl.gz > source/cards.jsonl
          test -s source/cards.jsonl

      - name: Probe original high-resolution image for the one unresolved card
        run: |
          set -euo pipefail
          python -m py_compile scripts/probe_require_soul_source_image.py
          python scripts/probe_require_soul_source_image.py --output-dir output/source-image-probe
          test -s output/source-image-probe/source-image-probe-summary.json

      - name: Download the immutable 831-card evidence artifact
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "fm1-soul-cost-image-evidence-809" \
            --dir evidence
          test -s evidence/target-cards.jsonl
          test -s evidence/image-audit-summary.json
          test "$(find evidence/images/large -maxdepth 1 -name '*.webp' | wc -l)" -eq 831
          test "$(find evidence/images/small -maxdepth 1 -name '*.webp' | wc -l)" -eq 831

      - name: Run modern and legacy special-token rail audit
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_require_soul_rail.py
          python scripts/audit_require_soul_rail.py \
            --evidence-dir evidence \
            --output-dir output
          test -s output/require-soul-rail-card-audit.csv
          test -s output/require-soul-rail-audit-summary.json

      - name: Run hybrid orb and complete secondary marker sequence audit
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_require_soul_hybrid_orbs.py
          python scripts/audit_require_soul_hybrid_orbs.py \
            --evidence-dir evidence \
            --output-dir output
          test -s output/require-soul-hybrid-orb-audit.csv
          test -s output/require-soul-hybrid-orb-audit-summary.json

      - name: Independently join all 831 rows to original DB29 source
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_require_soul_source_join.py
          python scripts/audit_require_soul_source_join.py \
            --source-cards-jsonl source/cards.jsonl \
            --evidence-dir evidence \
            --output-dir output
          test -s output/require-soul-source-join-audit.csv
          test -s output/require-soul-source-join-summary.json

      - name: Publish complete card-level review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db29-require-soul-rail-audit-${{ github.run_number }}
          path: |
            output/require-soul-rail-card-audit.csv
            output/require-soul-rail-audit-summary.json
            output/require-soul-hybrid-orb-audit.csv
            output/require-soul-hybrid-orb-audit-summary.json
            output/require-soul-source-join-audit.csv
            output/require-soul-source-join-summary.json
            output/source-image-probe/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Add combined audit summary to run page
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          rail=json.loads(Path("output/require-soul-rail-audit-summary.json").read_text(encoding="utf-8"))
          hybrid=json.loads(Path("output/require-soul-hybrid-orb-audit-summary.json").read_text(encoding="utf-8"))
          source=json.loads(Path("output/require-soul-source-join-summary.json").read_text(encoding="utf-8"))
          probe=json.loads(Path("output/source-image-probe/source-image-probe-summary.json").read_text(encoding="utf-8"))
          print("## DB29 RequireSoul visual and source audit")
          print()
          print("| Metric | Result |")
          print("|---|---:|")
          print(f"| Unique target cards | {rail['actual_unique_cards']} |")
          print(f"| BONUS/NCS/neutral exact count matches | {rail['counts'].get('EXACT_COUNT_MATCH', 0)} / {rail['special_token_population']} |")
          print(f"| Low-resolution / nonstandard images | {rail['counts'].get('LOW_RES_OR_NONSTANDARD_IMAGE', 0)} |")
          print(f"| Hybrid full-sequence matches | {hybrid['counts'].get('FULL_SEQUENCE_MATCH', 0)} |")
          print(f"| Hybrid full-sequence matches with manual orb confirmation | {hybrid['counts'].get('FULL_SEQUENCE_MATCH_MANUAL_HYBRID', 0)} |")
          print(f"| Independent DB29 source join complete | {source['source_join_complete']} |")
          print(f"| Source and visual matches | {source['counts'].get('SOURCE_AND_VISUAL_MATCH', 0)} |")
          print(f"| Source matches with visual evidence unresolved | {source['counts'].get('SOURCE_MATCH_VISUAL_UNRESOLVED', 0)} |")
          print(f"| Unresolved card source page probe | {probe['page_status']} |")
          print(f"| Candidate image URLs found | {len(probe.get('discovered_image_urls', []))} |")
          PY
