name: DB29 RequireSoul rail visual audit

on:
  push:
    branches:
      - research/require-soul-visual-audit-831-stage1
    paths:
      - "scripts/audit_require_soul_rail.py"
      - "scripts/audit_require_soul_hybrid_orbs.py"
      - ".github/workflows/require-soul-rail-audit.yml"
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Existing GitHub Actions run that produced the 831-card image evidence"
        required: true
        type: string
        default: "42357466809"

permissions:
  actions: read
  contents: read

concurrency:
  group: require-soul-rail-audit
  cancel-in-progress: false

jobs:
  visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id || '42357466809' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check Pillow numpy

      - name: Download the immutable 831-card evidence artifact
        run: |
          set -euo pipefail
          mkdir -p evidence
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "fm1-soul-cost-image-evidence-809" \
            --dir evidence
          test -s evidence/target-cards.jsonl
          test -s evidence/image-audit-summary.json
          test "$(find evidence/images/large -maxdepth 1 -name '*.webp' | wc -l)" -eq 831
          test "$(find evidence/images/small -maxdepth 1 -name '*.webp' | wc -l)" -eq 831

      - name: Run modern and legacy special-token rail audit
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_require_soul_rail.py
          python scripts/audit_require_soul_rail.py \
            --evidence-dir evidence \
            --output-dir output
          test -s output/require-soul-rail-card-audit.csv
          test -s output/require-soul-rail-audit-summary.json

      - name: Run 14-class hybrid orb audit
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_require_soul_hybrid_orbs.py
          python scripts/audit_require_soul_hybrid_orbs.py \
            --evidence-dir evidence \
            --output-dir output
          test -s output/require-soul-hybrid-orb-audit.csv
          test -s output/require-soul-hybrid-orb-audit-summary.json

      - name: Publish complete card-level review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db29-require-soul-rail-audit-${{ github.run_number }}
          path: |
            output/require-soul-rail-card-audit.csv
            output/require-soul-rail-audit-summary.json
            output/require-soul-hybrid-orb-audit.csv
            output/require-soul-hybrid-orb-audit-summary.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Add combined audit summary to run page
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          rail=json.loads(Path("output/require-soul-rail-audit-summary.json").read_text(encoding="utf-8"))
          hybrid=json.loads(Path("output/require-soul-hybrid-orb-audit-summary.json").read_text(encoding="utf-8"))
          print("## DB29 RequireSoul visual audit")
          print()
          print("| Metric | Result |")
          print("|---|---:|")
          print(f"| Unique target cards | {rail['actual_unique_cards']} |")
          print(f"| BONUS/NCS/neutral exact matches | {rail['counts'].get('EXACT_COUNT_MATCH', 0)} / {rail['special_token_population']} |")
          print(f"| Low-resolution / nonstandard images | {rail['counts'].get('LOW_RES_OR_NONSTANDARD_IMAGE', 0)} |")
          print(f"| Hybrid orb template matches | {hybrid['counts'].get('TEMPLATE_MATCH', 0)} / {hybrid['population']} |")
          print(f"| Hybrid manual visual confirmations | {hybrid['counts'].get('MANUAL_VISUAL_CONFIRMED', 0)} |")
          print(f"| Hybrid manual review queue | {hybrid['counts'].get('MANUAL_REVIEW', 0)} |")
          print()
          print("> A low-resolution image or unresolved template is not classified as a source-data error.")
          PY
