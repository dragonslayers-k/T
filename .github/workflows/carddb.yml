name: Card DB pipeline
on:
  push:
    branches: [carddb-rebuild]
  workflow_dispatch:
    inputs:
      mode:
        description: probe or full crawl
        required: true
        type: choice
        options: [probe, crawl]
        default: probe
permissions:
  contents: read
jobs:
  carddb:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Probe live site and card detail tabs
        if: github.event_name == 'push' || inputs.mode == 'probe'
        run: npm run probe
      - name: Crawl all 15,350 Firestore card documents
        if: github.event_name == 'push' || inputs.mode == 'crawl'
        env:
          EXPECTED_CARDS: "15350"
        run: npm run crawl
      - name: Build normalized SQLite database
        if: github.event_name == 'push' || inputs.mode == 'crawl'
        run: python scripts/build_db.py
      - name: Download original small and large card images
        if: github.event_name == 'push' || inputs.mode == 'crawl'
        env:
          IMAGE_CONCURRENCY: "6"
        run: npm run download-images
      - name: Audit complete 15,350-card dataset
        if: github.event_name == 'push' || inputs.mode == 'crawl'
        run: python scripts/audit_db.py
      - name: Archive image files
        if: github.event_name == 'push' || inputs.mode == 'crawl'
        run: tar -czf data/images.tar.gz -C data/images .
      - name: Upload database, raw source, images and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm1-carddb-${{ github.event_name }}-${{ github.run_number }}
          path: |
            artifacts/
            data/fm1_cards.sqlite
            data/raw/
            data/audit-report.json
            data/images.tar.gz
          if-no-files-found: warn
          retention-days: 30
