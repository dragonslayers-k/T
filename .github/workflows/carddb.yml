name: FM1 Card Database
# PR-open checks plus batched DB29 audit commits; do not audit on every small edit

on:
  push:
    branches: [main, feat/carddb-effect-semantic-pass]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/rules/**"
      - "data/reviews/**"
      - ".github/workflows/carddb.yml"
  pull_request:
    # Branch pushes already run the same tests; omit synchronize to avoid duplicate push+PR runs.
    types: [opened, reopened, ready_for_review]
    branches: [main, feat/carddb-effect-semantic-pass]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/rules/**"
      - "data/reviews/**"
      - ".github/workflows/carddb.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "tests = lightweight checks; effect-review = export card-context effect queue only; skill2-source-review = read-only DB29 Skill2 source examples; audit-release = full audit; probe/crawl = inspect or collect source"
        required: true
        type: choice
        options: [tests, probe, effect-review, skill2-source-review, manual-source-match, audit-release, crawl]
        default: tests
      source_release_tag:
        description: "Existing immutable DB Release used by audit-release, effect-review, or skill2-source-review mode"
        required: false
        type: string
        default: fm1-carddb-29
      publish_release:
        description: "Publish a new immutable Release only during audit-release/crawl after all release gates pass"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "New unused Release tag (only used when publish_release=true)"
        required: false
        type: string
        default: fm1-carddb-30

permissions:
  contents: write

concurrency:
  # Never cancel a DB audit or a deliberate validation run when another is queued.
  group: fm1-carddb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  carddb:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # [skill2-source-review] extracts read-only DB29 Skill2 card text; [effect-review] exports card-context effect candidates; [full-db-audit]/[full-db-crawl] run full pipelines. PRs stay on lightweight tests.
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-db-crawl]') && 'crawl') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[effect-review]') && 'effect-review') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[skill2-source-review]') && 'skill2-source-review') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-source-match]') && 'manual-source-match') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-db-audit]') && 'audit-release') || 'tests' }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag || 'fm1-carddb-29' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-db-release]')) }}
      RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-db-release]') && 'fm1-carddb-30') || 'fm1-carddb-29' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all lightweight regression tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_runtime_fallbacks.py scripts/resolve_runtime_fallbacks.py scripts/build_db.py scripts/soul_costs.py scripts/decode_soul_costs.py scripts/quality_audit.py scripts/audit_image_archive.py scripts/audit_card_taxonomy.py scripts/effect_pattern_audit.py scripts/build_effect_candidates.py scripts/import_manual_rules.py scripts/audit_manual_skill_card_source_matches.py scripts/infer_unmapped_skills.py scripts/import_community_skill_reference.py scripts/infer_effect_interpretations.py scripts/build_gap_reports.py scripts/audit_raw_field_applicability.py scripts/semantic_audit_status.py scripts/semantic_backlog_progress.py
          python -m unittest tests/test_runtime_fallbacks.py
          python -m unittest tests/test_runtime_fallback_resolver.py
          python -m unittest tests/test_effect_pattern_audit.py
          python -m unittest tests/test_cost_decoding.py
          python -m unittest tests/test_effect_candidates.py
          python -m unittest tests/test_manual_rules.py
          python -m unittest tests/test_manual_skill_engine_test_spec.py
          python -m unittest tests/test_manual_specialability_source_integrity.py
          python -m unittest tests/test_manual_engine_name_reconciliation.py
          python -m unittest tests/test_manual_skill_card_source_match_audit.py
          python -m unittest tests/test_infer_unmapped_skills.py
          python -m unittest tests/test_skill2_execution_review.py
          python -m unittest tests/test_skill2_source_evidence_summary.py
          python -m unittest tests/test_skill2_devoted_defense_adjudication.py
          python -m unittest tests/test_skill2_alliance_defense_adjudication.py
          python -m unittest tests/test_skill2_racial_defense_adjudication.py
          python -m unittest tests/test_soul_semantic_review_summary.py
          python -m unittest tests/test_skill2_engine_test_crosswalk.py
          python -m unittest tests/test_manual_skill1_engine_test_crosswalk.py
          python -m unittest tests/test_global_gameplay_engine_test_crosswalk.py
          python -m unittest tests/test_semantic_review_adjudication_overlay.py
          python -m unittest tests/test_card_field_coverage.py
          python -m unittest tests/test_raw_field_applicability.py
          python -m unittest tests/test_name_only_skill_image_probe.py
          python -m unittest tests/test_effect_interpretations.py
          python -m unittest tests/test_semantic_gap_completion.py
          python -m unittest tests/test_semantic_audit_status.py
          python -m unittest tests/test_semantic_backlog_progress.py
          python -m unittest tests/test_external_reference_review.py
          if [ -f data/reviews/fm1-carddb-29-area-counter-structured-review-2026-11-05.json ] && [ -f data/reviews/fm1-carddb-29-disenchant-definition-enrichment-2026-11-05.json ] && [ -f data/reviews/fm1-carddb-29-eka-mael-profile-enrichment-2026-11-05.json ] && [ -f data/reviews/fm1-external-card-and-magic-order-claims-2026-11-05.json ]; then
            python -m unittest tests/test_structured_semantic_enrichment.py
          else
            echo "Structured semantic enrichment tests are skipped because this branch does not include the stacked PR review records."
          fi
          python -m unittest tests/test_disenchant_shared_rule.py
          python -m unittest tests/test_summon_profile_review.py
          python scripts/build_effect_candidates.py --self-test
          python scripts/import_manual_rules.py --self-test
          python scripts/quality_audit.py --self-test
          python scripts/decode_soul_costs.py --self-test
          python scripts/build_db.py --self-test

      - name: Run exact Manual Skill1 source matching against immutable DB29
        if: ${{ env.MODE == 'manual-source-match' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_RELEASE_TAG}"
          mkdir -p data/source-archive data/reviews
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors "${BASE}/fm1_cards.sqlite.gz" -o data/source-archive/fm1_cards.sqlite.gz
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors "${BASE}/sqlite-build-summary.json" -o data/source-archive/sqlite-build-summary.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("data/source-archive")
          summary=json.loads((root/"sqlite-build-summary.json").read_text(encoding="utf-8"))
          actual=hashlib.sha256((root/"fm1_cards.sqlite.gz").read_bytes()).hexdigest()
          if summary.get("integrity")!="ok" or summary.get("cards")!=15350:
              raise SystemExit("Selected source release is not the audited 15,350-card DB")
          if actual.lower()!=str(summary.get("sqliteGzipSha256","")).lower():
              raise SystemExit("DB29 SQLite gzip SHA-256 mismatch")
          PY
          gzip -t data/source-archive/fm1_cards.sqlite.gz
          gzip -dc data/source-archive/fm1_cards.sqlite.gz > data/source-archive/fm1_cards.sqlite
          python - data/source-archive/fm1_cards.sqlite <<'PY'
          import sqlite3, sys
          db=sqlite3.connect(sys.argv[1])
          if db.execute("PRAGMA integrity_check").fetchone()[0]!="ok":
              raise SystemExit("SQLite integrity_check failed")
          if db.execute("SELECT count(*) FROM cards").fetchone()[0]!=15350:
              raise SystemExit("Unexpected DB29 card count")
          if db.execute("SELECT count(*) FROM card_fields WHERE field_key='Skill1'").fetchone()[0]<1000:
              raise SystemExit("Skill1 source inventory appears incomplete")
          PY
          python scripts/audit_manual_skill_card_source_matches.py \
            --db data/source-archive/fm1_cards.sqlite \
            --output data/reviews/fm1-manual-skill-db29-source-match-2026-11-05.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("data/reviews/fm1-manual-skill-db29-source-match-2026-11-05.json").read_text(encoding="utf-8"))
          for row in report["rules"]:
              cards=row["matched_card_rows"]
              sample=",".join(item["card_id"] for item in cards[:5])
              print(f'MANUAL_SKILL_MATCH {row["rule_id"]} | {row["manual_skill_name"]} | cards={len(cards)} | sample_ids={sample}')
          PY

      - name: Upload exact Manual Skill1 source match report
        if: ${{ env.MODE == 'manual-source-match' }}
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Manual-Skill1-DB29-Source-Match
          path: data/reviews/fm1-manual-skill-db29-source-match-2026-11-05.json
          if-no-files-found: error
          retention-days: 14

      - name: Install image decoder for full audits
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
          python -m pip install --disable-pip-version-check Pillow pytesseract

      - name: Set up Node and browser tools
        if: ${{ env.MODE == 'probe' || env.MODE == 'crawl' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install crawler dependencies
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'probe' || inputs.mode == 'crawl')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-db-crawl]')) }}
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Probe live card list and detail structure
        if: ${{ env.MODE == 'probe' }}
        run: npm run probe

      - name: Crawl all 15,350 Firestore card records
        if: ${{ env.MODE == 'crawl' }}
        env:
          EXPECTED_CARDS: "15350"
        run: npm run crawl

      - name: Download original small and large card images
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-db-crawl]')) }}
        env:
          IMAGE_CONCURRENCY: "12"
        run: npm run download-images

      - name: Download an existing immutable Release
        if: ${{ env.MODE == 'audit-release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_RELEASE_TAG}"
          mkdir -p data/raw data/source-archive
          for ASSET in cards.jsonl.gz enumtable.json appsettings.json crawl-summary.json image-summary.json fm1_cards.sqlite.gz; do
            curl --fail --location --retry 3 --retry-delay 2 "${BASE}/${ASSET}" -o "data/source-archive/${ASSET}"
          done
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors "${BASE}/images.tar.gz.part-aa" -o data/source-archive/images.tar.gz.part-aa
          gzip -t data/source-archive/cards.jsonl.gz
          gzip -dc data/source-archive/cards.jsonl.gz > data/raw/cards.jsonl
          cp data/source-archive/enumtable.json data/raw/enumtable.json
          cp data/source-archive/appsettings.json data/raw/appsettings.json
          cp data/source-archive/crawl-summary.json data/raw/crawl-summary.json
          cp data/source-archive/image-summary.json data/raw/image-summary.json
          cat data/source-archive/images.tar.gz.part-* > data/images.tar.gz
          tar -tzf data/images.tar.gz >/dev/null

      - name: Download immutable card source snapshot for focused effect review
        if: ${{ env.MODE == 'effect-review' || env.MODE == 'skill2-source-review' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_RELEASE_TAG}"
          mkdir -p data/raw data/source-archive
          for ASSET in cards.jsonl.gz enumtable.json appsettings.json; do
            curl --fail --location --retry 3 --retry-delay 2 "${BASE}/${ASSET}" -o "data/source-archive/${ASSET}"
          done
          gzip -t data/source-archive/cards.jsonl.gz
          gzip -dc data/source-archive/cards.jsonl.gz > data/raw/cards.jsonl
          cp data/source-archive/enumtable.json data/raw/enumtable.json
          cp data/source-archive/appsettings.json data/raw/appsettings.json


      - name: Build Skill2 source representatives from immutable DB29 snapshot
        if: ${{ env.MODE == 'skill2-source-review' }}
        run: |
          set -euo pipefail
          mkdir -p data/reviews
          python - <<'PY'
          import collections
          import html
          import json
          import os
          import re
          from pathlib import Path

          raw_path = Path("data/raw/cards.jsonl")
          if not raw_path.is_file():
              raise SystemExit("DB29 cards.jsonl is missing")

          expected = {
              18:  {"name": "기선제압", "rows": 181, "additional": 175, "card_text_only": 1, "missing": 5, "variants": 6},
              175: {"name": "헌신방어", "rows": 66,  "additional": 63,  "card_text_only": 0, "missing": 3, "variants": 6},
              100: {"name": "얼라이디펜스", "rows": 44, "additional": 44, "card_text_only": 0, "missing": 0, "variants": 3},
              44:  {"name": "레이셜디펜스", "rows": 35, "additional": 35, "card_text_only": 0, "missing": 0, "variants": 2},
              3:   {"name": "강한헌신방어", "rows": 28, "additional": 28, "card_text_only": 0, "missing": 0, "variants": 2},
              5:   {"name": "격노", "rows": 20, "additional": 20, "card_text_only": 0, "missing": 0, "variants": 2},
              181: {"name": "홀리오오라", "rows": 2,  "additional": 2,   "card_text_only": 0, "missing": 0, "variants": 2},
              166: {"name": "프레셔", "rows": 1,  "additional": 1,   "card_text_only": 0, "missing": 0, "variants": 1},
          }

          def plain_text(value):
              value = html.unescape(value or "")
              value = re.sub(r"(?i)<br\s*/?>", "\n", value)
              value = re.sub(r"<[^>]+>", "", value)
              return re.sub(r"\n{3,}", "\n\n", value).strip()

          groups = collections.defaultdict(list)
          with raw_path.open(encoding="utf-8") as stream:
              for line in stream:
                  if not line.strip():
                      continue
                  record = json.loads(line)
                  payload = record.get("raw_payload") or {}
                  try:
                      enum_value = int(str(payload.get("Skill2", "")).strip())
                  except (TypeError, ValueError):
                      continue
                  if enum_value not in expected:
                      continue
                  card_id = str(record.get("card_id") or payload.get("CardID") or "").strip()
                  name = str(record.get("name") or payload.get("Name") or "").strip()
                  text_base = payload.get("TextBase") if isinstance(payload.get("TextBase"), str) else ""
                  text_extra = payload.get("TextExtra") if isinstance(payload.get("TextExtra"), str) else ""
                  groups[enum_value].append({
                      "card_id": card_id,
                      "name": name,
                      "card_type": str(payload.get("Category") or ""),
                      "source_card_url": record.get("source_card_url"),
                      "TextBase": text_base,
                      "TextExtra": text_extra,
                      "TextBase_plain": plain_text(text_base),
                      "TextExtra_plain": plain_text(text_extra),
                  })

          report_groups = []
          total_cards = 0
          total_additional = 0
          total_card_text_only = 0
          total_missing = 0
          total_variants = 0
          total_missing_source_urls = 0
          all_missing = []
          all_card_text_only = []

          for enum_value, rule in expected.items():
              rows = sorted(groups.get(enum_value, []), key=lambda row: row["card_id"])
              total_cards += len(rows)
              additional_rows = [row for row in rows if row["TextExtra_plain"]]
              card_text_only = [row for row in rows if row["TextBase_plain"] and not row["TextExtra_plain"]]
              missing_rows = [row for row in rows if not row["TextBase_plain"] and not row["TextExtra_plain"]]
              variants = collections.defaultdict(list)
              for row in additional_rows:
                  variants[row["TextExtra_plain"]].append(row)

              actual = {
                  "rows": len(rows),
                  "additional": len(additional_rows),
                  "card_text_only": len(card_text_only),
                  "missing": len(missing_rows),
                  "variants": len(variants),
              }
              # Source text distributions are measured from immutable DB29 and are not
              # frozen as expected counts: wording/HTML variants are evidence, not errors.
              if actual["rows"] != rule["rows"]:
                  raise SystemExit(
                      f"Skill2 card-row count mismatch for {rule['name']} enum={enum_value}: "
                      f"expected={rule['rows']} actual={actual['rows']}"
                  )

              variant_reports = []
              for text_value, candidates in sorted(variants.items(), key=lambda item: item[0]):
                  candidates = sorted(candidates, key=lambda row: row["card_id"])
                  sample = candidates[0]
                  variant_reports.append({
                      "source_text_plain": text_value,
                      "row_count": len(candidates),
                      "candidate_card_ids": [row["card_id"] for row in candidates[:5]],
                      "sample_card": sample,
                  })

              report_groups.append({
                  "name": rule["name"],
                  "enum": enum_value,
                  **actual,
                  "source_text_variants": variant_reports,
              })
              total_additional += len(additional_rows)
              total_card_text_only += len(card_text_only)
              total_missing += len(missing_rows)
              total_variants += len(variants)
              total_missing_source_urls += sum(not row["source_card_url"] for row in rows)
              all_missing.extend(missing_rows)
              all_card_text_only.extend(card_text_only)

          summary = {
              "candidate_rows": total_cards,
              "distinct_card_ids": len({row["card_id"] for rows in groups.values() for row in rows}),
              "rule_groups": len(report_groups),
              "additional_text_rows": total_additional,
              "card_text_only_rows": total_card_text_only,
              "missing_card_local_excerpt_rows": total_missing,
              "distinct_additional_text_variants": total_variants,
              "missing_original_source_url_rows": total_missing_source_urls,
              "source_card_verified_rows": 0,
              "executable_rows": 0,
          }
          # Lock only the source inventory and review safety status. Text coverage,
          # missing excerpts, and variant counts are reported as observed measurements.
          expected_summary = {
              "candidate_rows": 377,
              "distinct_card_ids": 377,
              "rule_groups": 8,
              "source_card_verified_rows": 0,
              "executable_rows": 0,
          }
          summary_gate = {key: summary[key] for key in expected_summary}
          if summary_gate != expected_summary:
              raise SystemExit(f"DB29 Skill2 inventory mismatch: expected={expected_summary} actual={summary_gate}")

          report = {
              "schema_version": "fm1-skill2-source-representatives-v1",
              "source_release_tag": os.environ.get("SOURCE_RELEASE_TAG", "fm1-carddb-29"),
              "read_only": True,
              "summary": summary,
              "groups": report_groups,
              "card_text_only_records": all_card_text_only,
              "missing_records": all_missing,
              "promotion_policy": "Source examples and exact Skill2 enum matches are evidence only; no card mapping is promoted to source_card_verified or executable by this report.",
          }
          out_path = Path("data/reviews/fm1-skill2-source-representatives-db29.json")
          out_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print("DB29 Skill2 source evidence summary:")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          for group in report_groups:
              print(f"\n## {group['name']} (enum={group['enum']})")
              for variant in group["source_text_variants"]:
                  sample = variant["sample_card"]
                  print(json.dumps({
                      "card_id": sample["card_id"],
                      "name": sample["name"],
                      "source_card_url": sample["source_card_url"],
                      "variant_rows": variant["row_count"],
                      "TextExtra": sample["TextExtra_plain"],
                  }, ensure_ascii=False))
          print(f"\nWrote {out_path}")
          PY

          {
            echo "## DB29 Skill2 source representatives"
            echo
            echo "| Skill2 | Enum | Rows | TextExtra rows | Variants | Sample card IDs |"
            echo "|---|---:|---:|---:|---:|---|"
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/reviews/fm1-skill2-source-representatives-db29.json").read_text(encoding="utf-8"))
          for group in report["groups"]:
              ids = ", ".join(v["sample_card"]["card_id"] for v in group["source_text_variants"])
              print(f"| {group['name']} | {group['enum']} | {group['rows']} | {group['additional']} | {group['variants']} | {ids} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive freshly downloaded images
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-db-crawl]')) }}
        run: |
          set -euo pipefail
          test -s data/raw/cards.jsonl
          test -s data/raw/enumtable.json
          tar -czf data/images.tar.gz -C data/images .

      - name: Audit source fields, enum taxonomy, and exact card URLs
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python scripts/audit_card_taxonomy.py \
            --cards-jsonl data/raw/cards.jsonl \
            --enumtable data/raw/enumtable.json \
            --expected 15350 \
            --output data/card-taxonomy-audit.json
          python scripts/quality_audit.py \
            --cards-jsonl data/raw/cards.jsonl \
            --expected 15350 \
            --output data/quality-audit.json

      - name: Audit all 30,700 archived WebP images
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          mkdir -p data/image-audit
          python scripts/audit_image_archive.py \
            --archive data/images.tar.gz \
            --cards-jsonl data/raw/cards.jsonl \
            --output-dir data/image-audit
          cp data/image-audit/image-manifest.jsonl data/raw/image-manifest.jsonl

      - name: Build the normalized SQLite database
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python scripts/build_db.py
          python scripts/build_effect_candidates.py --db data/fm1_cards.sqlite
          python scripts/import_manual_rules.py --db data/fm1_cards.sqlite --catalogue data/rules/fm1-skill-catalog-v1.json
          python scripts/infer_unmapped_skills.py data/fm1_cards.sqlite
          python scripts/import_community_skill_reference.py data/fm1_cards.sqlite
          python scripts/probe_name_only_skill_pages.py --db data/fm1_cards.sqlite --out data/gap-reports/name-only-skill-source-probe.json
          python scripts/probe_name_only_skill_images.py --db data/fm1_cards.sqlite --archive data/images.tar.gz --out data/gap-reports/name-only-skill-image-probe.json
