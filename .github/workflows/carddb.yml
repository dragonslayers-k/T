            release-payload/fm1-skill-catalog-v1.json
            release-payload/images.tar.gz.part-*
          fail_on_unmatched_files: true

      - name: Upload normalized DB and audit outputs (no duplicate Release)
        if: ${{ success() && (env.MODE == 'audit-release' || env.MODE == 'crawl') }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-carddb-audit-${{ env.SOURCE_RELEASE_TAG }}-${{ github.run_number }}
          path: |
            data/fm1_cards.sqlite.gz
            data/raw/cards.jsonl.gz
            data/raw/enumtable.json
            data/card-taxonomy-audit.json
            data/quality-audit.json
            data/image-audit/image-audit-summary.json
            data/image-audit/image-manifest.jsonl
            data/sqlite-build-summary.json
            data/audit-report.json
            data/effect-pattern-inventory.json
            data/gap-reports/gap-report-summary.json
            data/gap-reports/card-field-gap-report.csv
            data/gap-reports/card-field-gap-report.jsonl
            data/gap-reports/cost-gap-report.jsonl
            data/gap-reports/cost-inference-report.jsonl
            data/gap-reports/skill-gap-report.jsonl
            data/gap-reports/inferred-skill-report.jsonl
            data/gap-reports/community-skill-report.jsonl
            data/gap-reports/skill2-execution-review.jsonl
            data/gap-reports/skill2-execution-review-summary.json
            data/rules/fm1-skill2-execution-catalog-v1.json
