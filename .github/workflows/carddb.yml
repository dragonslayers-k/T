name: FM1 Card Database
# Re-run full immutable DB29 coverage audit after audit-report serialization fix

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/rules/**"
      - "data/raw/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "package*.json"
      - ".github/workflows/carddb.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/rules/**"
      - "data/raw/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "package*.json"
      - ".github/workflows/carddb.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = inspect live site; audit-release = rebuild DB from an existing Release; crawl = collect a new source snapshot"
        required: true
        type: choice
        options: [probe, audit-release, crawl]
        default: audit-release
      source_release_tag:
        description: "Existing immutable DB Release used by audit-release mode"
        required: false
        type: string
        default: fm1-carddb-29
      publish_release:
        description: "Publish one new immutable Release only after all audits pass"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "New unused Release tag (only used when publish_release=true)"
        required: false
        type: string
        default: fm1-carddb-30

permissions:
  contents: write

concurrency:
  group: fm1-carddb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carddb:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[full-db-audit]') && 'audit-release') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-db-audit]') && 'audit-release') || 'tests' }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag || 'fm1-carddb-29' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-db-release]')) }}
      RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-db-release]') && 'fm1-carddb-30') || 'fm1-carddb-29' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all lightweight regression tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/compact_effect_review.py scripts/build_db.py scripts/soul_costs.py scripts/decode_soul_costs.py scripts/quality_audit.py scripts/audit_image_archive.py scripts/audit_card_taxonomy.py scripts/effect_pattern_audit.py scripts/build_effect_candidates.py scripts/import_manual_rules.py scripts/infer_unmapped_skills.py scripts/import_community_skill_reference.py scripts/infer_effect_interpretations.py scripts/build_gap_reports.py scripts/runtime_source_inventory.py scripts/build_runtime_cost_overlay.py
          python scripts/build_runtime_cost_overlay.py --self-test
          python -m unittest tests/test_effect_pattern_audit.py
          python -m unittest tests/test_compact_effect_review.py
          python -m unittest tests/test_cost_decoding.py
          python -m unittest tests/test_effect_candidates.py
          python -m unittest tests/test_manual_rules.py
          python -m unittest tests/test_infer_unmapped_skills.py
          python -m unittest tests/test_card_field_coverage.py
          python -m unittest tests/test_semantic_gap_completion.py
          python scripts/build_effect_candidates.py --self-test
          python scripts/import_manual_rules.py --self-test
          python scripts/quality_audit.py --self-test
          python scripts/decode_soul_costs.py --self-test
          python scripts/build_db.py --self-test

      - name: Build compact DB29 runtime source inventory (explicit marker only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          if ! git log -1 --format=%B "$PR_HEAD_SHA" | grep -Fq 'runtime-inventory'; then
            echo "No [runtime-inventory] marker on PR head $PR_HEAD_SHA; skipping DB29 source download."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/runtime-source"
          BASE="https://github.com/dragonslayers-k/T/releases/download/fm1-carddb-29"
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            "$BASE/fm1_cards.sqlite.gz" -o "$RUNNER_TEMP/runtime-source/fm1_cards.sqlite.gz"
          curl --fail --location --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            "$BASE/sqlite-build-summary.json" -o "$RUNNER_TEMP/runtime-source/sqlite-build-summary.json"
          python - "$RUNNER_TEMP/runtime-source" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          summary=json.loads((root/"sqlite-build-summary.json").read_text(encoding="utf-8"))
          actual=hashlib.sha256((root/"fm1_cards.sqlite.gz").read_bytes()).hexdigest()
          expected=summary.get("sqliteGzipSha256")
          if not expected or actual.lower()!=str(expected).lower():
              raise SystemExit(f"DB29 SQLite gzip checksum mismatch: {actual} != {expected}")
          if summary.get("cards") != 15350 or summary.get("integrity") != "ok":
              raise SystemExit("Downloaded SQLite summary does not describe a valid 15,350-card DB29 dataset")
          print(json.dumps({
              "sourceReleaseTag":"fm1-carddb-29",
              "sqliteGzipSha256":actual,
              "cards":summary.get("cards"),
              "categories":summary.get("categories"),
              "integrity":summary.get("integrity")
          },ensure_ascii=False))
          PY
          gzip -t "$RUNNER_TEMP/runtime-source/fm1_cards.sqlite.gz"
          gzip -dc "$RUNNER_TEMP/runtime-source/fm1_cards.sqlite.gz" > "$RUNNER_TEMP/runtime-source/fm1_cards.sqlite"
          python scripts/runtime_source_inventory.py \
            --db "$RUNNER_TEMP/runtime-source/fm1_cards.sqlite" \
            --output data/runtime-source-inventory.json
          python scripts/build_runtime_cost_overlay.py \
            --db "$RUNNER_TEMP/runtime-source/fm1_cards.sqlite" \
            --output data/runtime-cost-overlay.json
          echo "RUN_RUNTIME_INVENTORY=true" >> "$GITHUB_ENV"

      - name: Upload compact DB29 runtime source inventory
        if: ${{ always() && env.RUN_RUNTIME_INVENTORY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-db29-runtime-source-inventory-${{ github.run_number }}
          path: |
            data/runtime-source-inventory.json
            data/runtime-cost-overlay.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Install image decoder for full audits
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Set up Node and browser tools
        if: ${{ env.MODE == 'probe' || env.MODE == 'crawl' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install crawler dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'probe' || inputs.mode == 'crawl') }}
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Probe live card list and detail structure
        if: ${{ env.MODE == 'probe' }}
        run: npm run probe

      - name: Crawl all 15,350 Firestore card records
        if: ${{ env.MODE == 'crawl' }}
        env:
          EXPECTED_CARDS: "15350"
        run: npm run crawl

      - name: Download original small and large card images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl' }}
        env:
          IMAGE_CONCURRENCY: "6"
        run: npm run download-images

      - name: Download an existing immutable Release
        if: ${{ env.MODE == 'audit-release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SOURCE_RELEASE_TAG}"
          mkdir -p data/raw data/source-archive
          for ASSET in cards.jsonl.gz enumtable.json appsettings.json crawl-summary.json image-summary.json fm1_cards.sqlite.gz; do
            curl --fail --location --retry 3 --retry-delay 2 "${BASE}/${ASSET}" -o "data/source-archive/${ASSET}"
          done
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors "${BASE}/images.tar.gz.part-aa" -o data/source-archive/images.tar.gz.part-aa
          gzip -t data/source-archive/cards.jsonl.gz
          gzip -dc data/source-archive/cards.jsonl.gz > data/raw/cards.jsonl
          cp data/source-archive/enumtable.json data/raw/enumtable.json
          cp data/source-archive/appsettings.json data/raw/appsettings.json
          cp data/source-archive/crawl-summary.json data/raw/crawl-summary.json
          cp data/source-archive/image-summary.json data/raw/image-summary.json
          cat data/source-archive/images.tar.gz.part-* > data/images.tar.gz
          tar -tzf data/images.tar.gz >/dev/null

      - name: Archive freshly downloaded images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'crawl' }}
        run: |
          set -euo pipefail
          test -s data/raw/cards.jsonl
          test -s data/raw/enumtable.json
          tar -czf data/images.tar.gz -C data/images .

      - name: Audit source fields, enum taxonomy, and exact card URLs
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python scripts/audit_card_taxonomy.py \
            --cards-jsonl data/raw/cards.jsonl \
            --enumtable data/raw/enumtable.json \
            --expected 15350 \
            --output data/card-taxonomy-audit.json
          python scripts/quality_audit.py \
            --cards-jsonl data/raw/cards.jsonl \
            --expected 15350 \
            --output data/quality-audit.json

      - name: Audit all 30,700 archived WebP images
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          mkdir -p data/image-audit
          python scripts/audit_image_archive.py \
            --archive data/images.tar.gz \
            --cards-jsonl data/raw/cards.jsonl \
            --output-dir data/image-audit
          cp data/image-audit/image-manifest.jsonl data/raw/image-manifest.jsonl

      - name: Build the normalized SQLite database
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python scripts/build_db.py
          python scripts/build_effect_candidates.py --db data/fm1_cards.sqlite
          python scripts/import_manual_rules.py --db data/fm1_cards.sqlite --catalogue data/rules/fm1-skill-catalog-v1.json
          python scripts/infer_unmapped_skills.py data/fm1_cards.sqlite
          python scripts/import_community_skill_reference.py data/fm1_cards.sqlite
          python scripts/infer_effect_interpretations.py data/fm1_cards.sqlite
          python scripts/effect_pattern_audit.py \
            --db data/fm1_cards.sqlite \
            --out data/effect-pattern-inventory.json \
            --top 500 \
            --summary-only

      - name: Generate card-level gap reports
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python scripts/build_gap_reports.py --db data/fm1_cards.sqlite --out-dir data/gap-reports
          cat data/gap-reports/gap-report-summary.json
          cat data/gap-reports/effect-low-confidence-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/gap-reports/gap-report-summary.json").read_text(encoding="utf-8"))
          counts=r.get("field_status_counts",{})
          assert counts.get("missing_on_card",0)==0, counts
          assert counts.get("empty_source_value",0)==0, counts
          assert r.get("unresolved_cost_rows",0)==0, r
          assert r.get("unmapped_skill_card_rows",0)==0, r
          PY

      - name: Build compact card-level effect review output
        if: ${{ always() && (env.MODE == 'audit-release' || env.MODE == 'crawl') && hashFiles('data/gap-reports/effect-gap-report.jsonl') != '' }}
        run: |
          set -euo pipefail
          python scripts/compact_effect_review.py \
            --input data/gap-reports/effect-gap-report.jsonl \
            --csv data/gap-reports/effect-review-compact.csv \
            --summary data/gap-reports/effect-review-compact-summary.json \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload focused semantic review queues
        if: ${{ always() && (env.MODE == 'audit-release' || env.MODE == 'crawl') && hashFiles('data/gap-reports/effect-gap-report.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-carddb-semantic-review-${{ env.SOURCE_RELEASE_TAG }}-${{ github.run_number }}
          path: |
            data/gap-reports/effect-gap-report.jsonl
            data/gap-reports/effect-low-confidence-summary.json
            data/gap-reports/effect-review-compact.csv
            data/gap-reports/effect-review-compact-summary.json
            data/gap-reports/effect-review-compact.csv
            data/gap-reports/effect-review-compact-summary.json
            data/gap-reports/inferred-skill-report.jsonl
            data/gap-reports/community-skill-report.jsonl
            data/gap-reports/cost-inference-report.jsonl
            data/gap-reports/cost-token-review-queue.jsonl
            data/gap-reports/cost-token-review-queue.csv
            data/gap-reports/unmapped-skill-inventory.csv
            data/gap-reports/gap-report-summary.json
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Audit complete card, soul-cost, and skill mapping coverage
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python scripts/audit_db.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("data/audit-report.json").read_text(encoding="utf-8"))
          keys=(
              "unique_cards","soul_cost_fully_parsed","soul_cost_needs_review",
              "soul_mapping_review","soul_semantic_review","soul_manual_review",
              "skill_mapping_rows","skill_source_rows","skill_unmapped_rows",
              "skill_manual_verified_rows","skill_community_candidate_rows",
              "skill_no_special_rows","skill_inventory_unmapped_values",
              "inferred_skill_card_rows","unmapped_skill_card_rows_after_inference",
              "effect_clause_rows","effect_interpretation_rows","effect_interpretation_missing",
              "effect_interpretation_low_confidence","field_coverage_complete","semantic_completeness_pass",
              "skill_mapping_coverage_accounted_for"
          )
          print(json.dumps({key:report.get(key) for key in keys},ensure_ascii=False,indent=2))
          if not report.get("field_coverage_complete"):
              raise SystemExit("Card-by-field coverage matrix was not persisted or has unresolved source mismatches")
          if not report.get("skill_mapping_coverage_accounted_for"):
              raise SystemExit("Skill1/Skill2 source rows are not fully represented in card_rule_mappings")
          if not report.get("semantic_completeness_pass"):
              raise SystemExit("Semantic inference coverage is incomplete: inspect audit-report.json")
          if report.get("inferred_skill_name_only_rows", 999) > 30:
              raise SystemExit("Too many skill definitions still rely on name-only inference")
          if report.get("effect_interpretation_low_confidence", 999999) > 2000:
              raise SystemExit("Too many effect clauses remain unparsed; inspect effect-gap-report.jsonl")
          PY

      - name: Verify SQLite counts, references, images, costs, and search
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, sqlite3
          from pathlib import Path

          db = sqlite3.connect("data/fm1_cards.sqlite")
          db.row_factory = sqlite3.Row
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          category_rows = db.execute(
              "SELECT card_type, COUNT(*) AS n FROM cards GROUP BY card_type"
          ).fetchall()
          categories = {row["card_type"]: row["n"] for row in category_rows}
          expected_categories = {"지형":289, "유닛":8633, "마법":3857, "아이템":1748, "인챈트":823}
          cards = db.execute("SELECT COUNT(*) FROM cards").fetchone()[0]
          unique_ids = db.execute("SELECT COUNT(DISTINCT card_id) FROM cards").fetchone()[0]
          fields = db.execute("SELECT COUNT(*) FROM card_fields").fetchone()[0]
          texts = db.execute("SELECT COUNT(*) FROM card_texts").fetchone()[0]
          effects = db.execute("SELECT COUNT(*) FROM card_effects").fetchone()[0]
          effect_candidate_rows = db.execute("SELECT COUNT(*) FROM card_effect_candidate_summaries").fetchone()[0]
          effect_clause_rows = db.execute("SELECT COUNT(*) FROM card_effect_clauses").fetchone()[0]
          effect_separators = db.execute("SELECT COUNT(*) FROM card_effect_clauses WHERE segment_type='separator'").fetchone()[0]
          effect_span_errors = db.execute(
              "SELECT COUNT(*) FROM card_effect_candidate_summaries "
              "WHERE span_integrity_status NOT IN ('exact','not_split')"
          ).fetchone()[0]
          manual_rule_count = db.execute(
              "SELECT COUNT(*) FROM game_rule_catalog WHERE source_authority='manual'"
          ).fetchone()[0]
          community_rule_count = db.execute(
              "SELECT COUNT(*) FROM game_rule_catalog WHERE source_authority='community'"
          ).fetchone()[0]
          card_rule_mapping_rows = db.execute("SELECT COUNT(*) FROM card_rule_mappings").fetchone()[0]
          manual_skill_mappings = db.execute(
              "SELECT COUNT(*) FROM card_rule_mappings WHERE mapping_status='manual_verified'"
          ).fetchone()[0]
          community_skill_candidates = db.execute(
              "SELECT COUNT(*) FROM card_rule_mappings WHERE mapping_status='community_documented_candidate'"
          ).fetchone()[0]
          unmapped_skill_rows = db.execute(
              "SELECT COUNT(*) FROM card_rule_mappings WHERE mapping_status='unmapped'"
          ).fetchone()[0]
          inferred_skill_rule_count = db.execute(
              "SELECT COUNT(*) FROM game_rule_catalog WHERE source_authority='inferred'"
          ).fetchone()[0]
          name_only_low_confidence_skill_rules = db.execute(
              "SELECT COUNT(*) FROM game_rule_catalog WHERE source_authority='inferred' AND confidence='low'"
          ).fetchone()[0]
          effect_interpretation_rows = db.execute("SELECT COUNT(*) FROM card_effect_interpretations").fetchone()[0]
          effect_interpretation_missing = db.execute(
              "SELECT COUNT(*) FROM card_effect_clauses cl LEFT JOIN card_effect_interpretations i USING(clause_id) WHERE i.clause_id IS NULL"
          ).fetchone()[0]
          low_confidence_effect_interpretations = db.execute(
              "SELECT COUNT(*) FROM card_effect_interpretations WHERE confidence='low'"
          ).fetchone()[0]
          skill_inventory_rows = db.execute("SELECT COUNT(*) FROM skill_enum_inventory").fetchone()[0]
          community_playable_rows = db.execute(
              "SELECT COUNT(*) FROM game_rule_catalog WHERE source_authority='community' AND playable_by_default=1"
          ).fetchone()[0]
          field_keys = db.execute("SELECT COUNT(DISTINCT field_key) FROM card_fields").fetchone()[0]
          source_pages = db.execute("SELECT COUNT(*) FROM source_pages").fetchone()[0]
          costs = db.execute("SELECT COUNT(*) FROM card_costs").fetchone()[0]
          token_known = db.execute("SELECT COUNT(*) FROM card_costs WHERE soul_known=1").fetchone()[0]
          mapping_review = db.execute("SELECT COUNT(*) FROM card_costs WHERE mapping_review=1").fetchone()[0]
          semantic_review = db.execute("SELECT COUNT(*) FROM card_costs WHERE semantic_review=1").fetchone()[0]
          tokens = db.execute("SELECT COUNT(*) FROM card_soul_cost_tokens").fetchone()[0]
          images = db.execute("SELECT COUNT(*) FROM card_images").fetchone()[0]
          verified_images = db.execute(
              "SELECT COUNT(*) FROM card_images WHERE download_status='archive_verified' "
              "AND mime_type='image/webp' AND sha256 IS NOT NULL AND archive_path IS NOT NULL"
          ).fetchone()[0]
          detail_urls = db.execute(
              "SELECT COUNT(*) FROM cards WHERE source_card_url LIKE 'https://fmlunatic.com/card/%'"
          ).fetchone()[0]
          search_rows = db.execute("SELECT COUNT(*) FROM card_search").fetchone()[0]
          korean_hits = db.execute(
              "SELECT COUNT(*) FROM card_search WHERE card_search MATCH '선물쟁탈전'"
          ).fetchone()[0]
          ncs_hits = db.execute(
              "SELECT COUNT(*) FROM card_search WHERE card_search MATCH 'NCS'"
          ).fetchone()[0]
          fk_errors = len(db.execute("PRAGMA foreign_key_check").fetchall())
          summary = {
              "integrity": integrity, "cards": cards, "uniqueIds": unique_ids,
              "categories": categories, "fields": fields, "fieldKeys": field_keys,
              "texts": texts, "effects": effects,
              "effectCandidateRows": effect_candidate_rows,
              "effectClauseRows": effect_clause_rows,
              "effectSeparatorRows": effect_separators,
              "effectSpanIntegrityErrors": effect_span_errors,
              "manualRuleCount": manual_rule_count,
              "communityRuleCandidateCount": community_rule_count,
              "cardRuleMappingRows": card_rule_mapping_rows,
              "manualSkillMappingRows": manual_skill_mappings,
              "communitySkillCandidateRows": community_skill_candidates,
              "inferredSkillRuleCount": inferred_skill_rule_count,
              "nameOnlyLowConfidenceSkillRules": name_only_low_confidence_skill_rules,
              "effectInterpretationRows": effect_interpretation_rows,
              "effectInterpretationMissing": effect_interpretation_missing,
              "lowConfidenceEffectInterpretations": low_confidence_effect_interpretations,
              "unmappedSkillRows": unmapped_skill_rows,
              "skillEnumInventoryRows": skill_inventory_rows,
              "playableCommunityRuleRows": community_playable_rows,
              "sourcePages": source_pages,
              "costRows": costs, "tokenParsedRows": token_known,
              "hybridMappingReview": mapping_review, "specialSemanticsReview": semantic_review,
              "soulTokens": tokens, "imageRows": images, "archiveVerifiedImages": verified_images,
              "detailUrlRows": detail_urls, "searchIndexRows": search_rows,
              "koreanSearchHits": korean_hits, "ncsSearchHits": ncs_hits,
              "foreignKeyErrors": fk_errors,
          }
          import hashlib
          summary["sqliteDatabaseSha256"] = hashlib.sha256(
              Path("data/fm1_cards.sqlite").read_bytes()
          ).hexdigest()
          Path("data/sqlite-build-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          if (
              integrity != "ok" or cards != 15350 or unique_ids != 15350
              or categories != expected_categories or costs != 15350 or token_known != 15350
              or mapping_review != 52 or semantic_review != 439 or tokens != 24166
              or images != 30700 or verified_images != 30700 or detail_urls != 15350
              or search_rows != 15350 or korean_hits < 1 or ncs_hits < 1 or fk_errors
              or fields < 600000 or field_keys != 55 or texts < 17000 or effects < 17000
              or effect_candidate_rows != texts or effect_clause_rows < effect_candidate_rows
              or effect_span_errors != 0 or source_pages != 30700
              or manual_rule_count != 27 or community_rule_count < 41
              or card_rule_mapping_rows < 15000 or manual_skill_mappings < 1000
              or community_skill_candidates < 100 or skill_inventory_rows < 100
              or community_playable_rows != 0 or unmapped_skill_rows != 0
              or inferred_skill_rule_count < 700 or name_only_low_confidence_skill_rules > 100
              or effect_interpretation_rows != effect_clause_rows
              or effect_interpretation_missing != 0
          ):
              raise SystemExit("SQLite validation failed: " + json.dumps(summary, ensure_ascii=False))
          with gzip.open("data/fm1_cards.sqlite.gz", "wb", compresslevel=6) as out:
              with open("data/fm1_cards.sqlite", "rb") as source:
                  while chunk := source.read(1024 * 1024):
                      out.write(chunk)
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Prepare image archive chunks and release payload
        if: ${{ env.MODE == 'audit-release' || env.MODE == 'crawl' }}
        run: |
          set -euo pipefail
          if [ ! -f data/images.tar.gz.part-aa ]; then
            split -b 1800m data/images.tar.gz data/images.tar.gz.part-
          fi
          gzip -c data/raw/cards.jsonl > data/raw/cards.jsonl.gz
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path=Path("data/sqlite-build-summary.json")
          summary=json.loads(path.read_text(encoding="utf-8"))
          def sha(filename):
              return hashlib.sha256(Path(filename).read_bytes()).hexdigest()
          summary["sqliteGzipSha256"]=sha("data/fm1_cards.sqlite.gz")
          summary["cardsJsonlGzipSha256"]=sha("data/raw/cards.jsonl.gz")
          summary["enumtableSha256"]=sha("data/raw/enumtable.json")
          summary["imageArchivePartAaSha256"]=sha("data/images.tar.gz.part-aa")
          summary["sourceReleaseTag"]=os.environ.get("SOURCE_RELEASE_TAG","fm1-carddb-27")
          path.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({k:summary[k] for k in (
              "sqliteGzipSha256","cardsJsonlGzipSha256","enumtableSha256","imageArchivePartAaSha256"
          )},ensure_ascii=False))
          PY
          mkdir -p release-payload
          cp data/fm1_cards.sqlite.gz release-payload/
          cp data/raw/cards.jsonl.gz release-payload/
          cp data/raw/enumtable.json release-payload/
          cp data/raw/appsettings.json release-payload/
          cp data/raw/crawl-summary.json release-payload/
          cp data/raw/image-summary.json release-payload/
          cp data/card-taxonomy-audit.json release-payload/
          cp data/quality-audit.json release-payload/
          cp data/image-audit/image-audit-summary.json release-payload/
          cp data/sqlite-build-summary.json release-payload/
          cp data/effect-pattern-inventory.json release-payload/
          cp data/rules/fm1-skill-catalog-v1.json release-payload/
          cp data/images.tar.gz.part-* release-payload/

      - name: Verify that the requested Release tag is unused
        if: ${{ env.PUBLISH_RELEASE == 'true' && (env.MODE == 'audit-release' || env.MODE == 'crawl') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::A new release_tag is required when publish_release is enabled."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag already exists. Existing Releases are immutable; choose a new tag only for a meaningful DB revision."
            exit 1
          fi

      - name: Publish one intentional immutable DB Release
        if: ${{ success() && env.PUBLISH_RELEASE == 'true' && (env.MODE == 'audit-release' || env.MODE == 'crawl') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FM1 Card Database ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body: |
            Immutable, audited Fantasy Masters card database package.
            Source records: 15,350
            Categories: Land 289 / Unit 8,633 / Magic 3,857 / Item 1,748 / Enchant 823
            Images: 30,700 verified WebP files (small + large)
            Includes normalized SQLite, original source records, effect candidate inventory and source-versioned rule catalogue.
            27 Manual.zip special-skill rules are mapped to source cards; 41 later community definitions remain non-executable candidates.
            Costs with unresolved hybrid or special semantics remain explicitly marked for review.
          files: |
            release-payload/fm1_cards.sqlite.gz
            release-payload/cards.jsonl.gz
            release-payload/enumtable.json
            release-payload/appsettings.json
            release-payload/crawl-summary.json
            release-payload/image-summary.json
            release-payload/card-taxonomy-audit.json
            release-payload/quality-audit.json
            release-payload/image-audit-summary.json
            release-payload/sqlite-build-summary.json
            release-payload/effect-pattern-inventory.json
            release-payload/fm1-skill-catalog-v1.json
            release-payload/images.tar.gz.part-*
          fail_on_unmatched_files: true

      - name: Upload normalized DB and audit outputs (no duplicate Release)
        if: ${{ always() && (env.MODE == 'audit-release' || env.MODE == 'crawl') }}
        uses: actions/upload-artifact@v4
        with:
          name: fm1-carddb-audit-${{ env.SOURCE_RELEASE_TAG }}-${{ github.run_number }}
          path: |
            data/fm1_cards.sqlite.gz
            data/raw/cards.jsonl.gz
            data/raw/enumtable.json
            data/card-taxonomy-audit.json
            data/quality-audit.json
            data/image-audit/image-audit-summary.json
            data/image-audit/image-manifest.jsonl
            data/sqlite-build-summary.json
            data/effect-pattern-inventory.json
            data/gap-reports/gap-report-summary.json
            data/gap-reports/card-field-gap-report.csv
            data/gap-reports/card-field-gap-report.jsonl
            data/gap-reports/cost-gap-report.jsonl
            data/gap-reports/cost-inference-report.jsonl
            data/gap-reports/skill-gap-report.jsonl
            data/gap-reports/inferred-skill-report.jsonl
            data/gap-reports/community-skill-report.jsonl
            data/gap-reports/unmapped-skill-inventory.csv
            data/gap-reports/effect-gap-report.jsonl
            data/rules/fm1-skill-catalog-v1.json
            data/rules/manual-specialability-source.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
